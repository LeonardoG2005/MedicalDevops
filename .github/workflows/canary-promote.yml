name: Canary v4 - Promover por etapas

# Manual: raises canary traffic stage by stage, measures each one and aborts
# only when the quality gate says so. Thresholds live in canary/slo.json.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Que simular durante la carga"
        type: choice
        default: "exito"
        options:
          - exito
          - falla-errores
          - falla-latencia
      stages:
        description: "Porcentajes de trafico al canary, separados por coma"
        default: "10,50,100"
        required: true
      bake:
        description: "Minutos de horneado (bake time) por etapa"
        default: "4"
        required: true

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-40fc41d1-6899-4ce0-9ef
  REGION: us-central1
  SERVICE: medical-documents-api

jobs:
  promote:
    name: Etapas con puerta de calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2

      # The canary is the revision tagged "canary"; the baseline, the one that
      # serves 100 % today. If the canary already has all the traffic there is
      # nothing to promote.
      - name: Identificar las revisiones
        id: revisions
        run: |
          DATA=$(gcloud run services describe $SERVICE --region=$REGION --format=json)
          CANARY=$(echo "$DATA" | jq -r '.status.traffic[] | select(.tag=="canary") | .revisionName')
          STABLE=$(echo "$DATA" | jq -r '[.status.traffic[] | select(.percent==100)][0].revisionName')
          if [ -z "$CANARY" ] || [ "$CANARY" = "$STABLE" ]; then
            echo "No hay un canary pendiente: despliega uno con el workflow de despliegue"
            exit 1
          fi
          echo "canary=$CANARY" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "url=$(echo "$DATA" | jq -r '.status.url')" >> "$GITHUB_OUTPUT"

      # A regression is simulated with the X-Fault header: only the canary
      # obeys it, the stable image does not contain that code
      - name: Promover
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          case "$SCENARIO" in
            falla-errores)  FAULT="error=0.5" ;;
            falla-latencia) FAULT="latency=3000" ;;
            *)              FAULT="" ;;
          esac
          node canary/promote.js \
            --url "${{ steps.revisions.outputs.url }}" \
            --canary "${{ steps.revisions.outputs.canary }}" \
            --stable "${{ steps.revisions.outputs.stable }}" \
            --stages "${{ inputs.stages }}" --bake "${{ inputs.bake }}" \
            --fault "$FAULT"

      - name: Reparto final de trafico
        if: always()
        run: |
          {
            echo "### Reparto final de trafico"
            gcloud run services describe $SERVICE --region=$REGION --format=json \
              | jq -r '.status.traffic[] | "- \(.percent // 0) % \(.revisionName) (\(.tag // "sin etiqueta"))"'
          } >> "$GITHUB_STEP_SUMMARY"
