name: Terraform GCP and API deployment

on:
  push:
    branches:
      - feature/terraform
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  GCP_PROJECT_ID: project-40fc41d1-6899-4ce0-9ef
  GCP_REGION: us-central1

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medical_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d medical_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medical_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: terraform -chdir=terraform fmt -check -recursive
      - name: Initialize Terraform remote state
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=medicaldevops/terraform"
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform plan -input=false -lock-timeout=5m
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Run API tests
        run: >-
          node --test --test-concurrency=1
          test/generated-documents.test.js
          test/health.test.js
          test/images.test.js
          test/medical-notes.test.js
          test/v3.notes.test.js
          test/fault-injection.test.js
      - run: npm ci --prefix orchestrator
      - run: npm test --prefix orchestrator

  # The API itself no longer deploys from here: the canary-* workflows build
  # its images and move traffic between the stable and canary Cloud Run
  # revisions. This job only keeps the supporting infrastructure (database,
  # secrets, dashboard, alerts) in sync with the code.
  apply:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Initialize Terraform remote state
        env:
          TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          terraform -chdir=terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="prefix=medicaldevops/terraform"
      - run: terraform -chdir=terraform apply -auto-approve -input=false
