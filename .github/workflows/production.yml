name: Production Environment CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  production:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medical_prod
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d medical_prod"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medical_prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        run: npm run db:migrate

      - name: Run tests
        run: npm test

      - name: Run coverage gate
        run: npm run test:coverage:prod

      - name: Build Docker image
        run: docker build -t medical-documents-api:prod .

      - name: Deploy to PRODUCTION
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_PRODUCTION_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_HOOK_URL }}
        run: curl -X POST "$RENDER_PRODUCTION_HOOK_URL"