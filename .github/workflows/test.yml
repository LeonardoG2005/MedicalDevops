name: Test Environment CI

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medical_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d medical_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/medical_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run coverage gate
        run: npm run test:coverage:test

      - name: Build Docker image
        run: docker build -t medical-documents-api:test .

      - name: Deploy to TEST
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        env:
          RENDER_TEST_HOOK_URL: ${{ secrets.RENDER_TEST_HOOK_URL }}
        run: curl -X POST "$RENDER_TEST_HOOK_URL"