apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: medical-api-database-url
  namespace: default
spec:
  provider: gke
  parameters:
    # Every secret the pods need, read from Secret Manager with the Workload
    # Identity of the "medical-api" service account (service-account.yaml).
    # medical-api-gsa needs roles/secretmanager.secretAccessor on each one.
    secrets: |
      - resourceName: "projects/project-40fc41d1-6899-4ce0-9ef/secrets/medical-api-database-url-sync/versions/latest"
        path: "DATABASE_URL"

      - resourceName: "projects/project-40fc41d1-6899-4ce0-9ef/secrets/medical-api-api-a-url/versions/latest"
        path: "API_A_URL"

      - resourceName: "projects/project-40fc41d1-6899-4ce0-9ef/secrets/medical-api-api-c-url/versions/latest"
        path: "API_C_URL"

      - resourceName: "projects/project-40fc41d1-6899-4ce0-9ef/secrets/medical-api-chaos-token/versions/latest"
        path: "CHAOS_TOKEN"

      - resourceName: "projects/project-40fc41d1-6899-4ce0-9ef/secrets/otel-endpoint/versions/latest"
        path: "OTEL_EXPORTER_OTLP_ENDPOINT"

      - resourceName: "projects/project-40fc41d1-6899-4ce0-9ef/secrets/otel-headers/versions/latest"
        path: "OTEL_EXPORTER_OTLP_HEADERS"
