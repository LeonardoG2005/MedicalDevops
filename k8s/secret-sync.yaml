apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata:
  name: medical-api-secrets
  namespace: default
spec:
  serviceAccountName: medical-api
  secretProviderClassName: medical-api-database-url
  secretObject:
    type: Opaque
    data:
      - sourcePath: "DATABASE_URL"
        targetKey: "DATABASE_URL"

      - sourcePath: "API_A_URL"
        targetKey: "API_A_URL"

      - sourcePath: "API_C_URL"
        targetKey: "API_C_URL"

      - sourcePath: "CHAOS_TOKEN"
        targetKey: "CHAOS_TOKEN"

      - sourcePath: "OTEL_EXPORTER_OTLP_ENDPOINT"
        targetKey: "OTEL_EXPORTER_OTLP_ENDPOINT"

      - sourcePath: "OTEL_EXPORTER_OTLP_HEADERS"
        targetKey: "OTEL_EXPORTER_OTLP_HEADERS"
