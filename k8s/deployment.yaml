apiVersion: apps/v1
kind: Deployment
metadata:
  name: medical-documents-api
  namespace: default
  labels:
    app: medical-documents-api
spec:
  # Two replicas (rubric minimum). The HPA keeps them at two during the experiment.
  replicas: 2

  selector:
    matchLabels:
      app: medical-documents-api

  template:
    metadata:
      labels:
        app: medical-documents-api

    spec:
      serviceAccountName: medical-api
      terminationGracePeriodSeconds: 30

      containers:
        - name: medical-documents-api

          # The deploy workflow replaces this with the image digest it just
          # pushed (kubectl set image), so the tag here is only a placeholder.
          image: us-central1-docker.pkg.dev/project-40fc41d1-6899-4ce0-9ef/medical-api/medical-documents-api:v5
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: medical-api-config

          # Everything sensitive comes from the Secret synced from Secret
          # Manager (secret-provider-class.yaml + secret-sync.yaml)
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: medical-api-secrets
                  key: DATABASE_URL

            - name: API_C_URL
              valueFrom:
                secretKeyRef:
                  name: medical-api-secrets
                  key: API_C_URL

            - name: API_A_URL
              valueFrom:
                secretKeyRef:
                  name: medical-api-secrets
                  key: API_A_URL

            - name: CHAOS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: medical-api-secrets
                  key: CHAOS_TOKEN

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: medical-api-secrets
                  key: OTEL_EXPORTER_OTLP_ENDPOINT

            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: medical-api-secrets
                  key: OTEL_EXPORTER_OTLP_HEADERS

          # Startup: up to 60 s to boot. Readiness: out of the Service while
          # /health fails. Liveness: restart if the process stops answering.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"

        - name: cloud-sql-proxy

          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.25.4

          args:
            - "--structured-logs"
            - "--port=5432"
            - "project-40fc41d1-6899-4ce0-9ef:us-central1:medical-devops-db"

          securityContext:
            runAsNonRoot: true

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "500m"
              memory: "1Gi"
